<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Medusa - Login">
    <title>MEDUSA - Login</title>
    <!-- Global Theme Controller -->
    <script src="assets/js/theme-toggle.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Modern Reset and Design Tokens */
        :root {
            --gold: #dfba86;      /* Accent Soft Gold */
            --white: #FAF7F0;     /* Warm Ivory text */
            --gray-light: rgba(250, 247, 240, 0.6);
            --bg-glass: rgba(13, 32, 22, 0.65); /* Translucent Forest Green */
            --border-glass: rgba(223, 186, 134, 0.2);
            --transition: all 0.25s ease;
            --rosewood: #5A1827;
            --rosewood-light: #7E2638;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-color: #0D2016; /* Deep Forest Green background */
            position: relative;
        }

        /* Centered Premium Glassmorphic Card */
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: var(--transition);
        }

        .login-container:hover {
            border-color: rgba(212, 175, 55, 0.25);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95);
        }

        /* App Branding */
        .brand-container {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            border-radius: 50%;
            border: 1.5px solid var(--gold);
            padding: 2px;
            background: rgba(0, 0, 0, 0.5);
            transition: var(--transition);
        }

        .brand-logo-img:hover {
            transform: scale(1.02);
        }

        /* Form Inputs styling */
        .login-form-container {
            margin-bottom: 10px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 22px;
            padding: 6px 0;
            transition: var(--transition);
        }

        .input-wrapper.focused {
            border-bottom-color: var(--gold);
        }

        .input-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            opacity: 0.75;
            transition: var(--transition);
        }

        .input-wrapper.focused .input-icon {
            color: var(--gold);
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--white);
            font-size: 0.92rem;
            padding-left: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
        }

        /* Prevent background autofill colors from ruining the dark visual style */
        .input-field:-webkit-autofill,
        .input-field:-webkit-autofill:hover,
        .input-field:-webkit-autofill:focus,
        .input-field:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0D2016 inset !important;
            -webkit-text-fill-color: var(--white) !important;
            border-radius: 4px;
        }

        /* Remember Me & Forgot Password Row */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.8rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-light);
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
            font-weight: 500;
        }

        .remember-me:hover {
            color: var(--white);
        }

        .remember-me input {
            display: none;
        }

        .checkbox-custom {
            width: 14px;
            height: 14px;
            border: 1.2px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            position: relative;
            transition: var(--transition);
            background: rgba(0, 0, 0, 0.3);
        }

        .remember-me input:checked + .checkbox-custom {
            background-color: var(--gold);
            border-color: var(--gold);
        }

        .remember-me input:checked + .checkbox-custom::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 3px;
            height: 6px;
            border: solid #000000;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(45deg);
        }

        /* Forgot Password link */
        .forgot-password-link {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .forgot-password-link:hover {
            color: var(--white);
        }

        /* Submit Button - Minimal Matte Gold */
        .btn-submit {
            width: 100%;
            background-color: var(--rosewood);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background-color: var(--rosewood-light);
            color: #ffffff !important;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Member Sign up text */
        .member-text {
            text-align: center;
            color: var(--white);
            font-size: 0.82rem;
            font-weight: 500;
            opacity: 0.75;
            margin-bottom: 5px;
        }

        .member-text a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
            margin-left: 4px;
        }

        .member-text a:hover {
            color: var(--white);
        }

        /* Social Icons container */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-link {
            color: var(--white);
            opacity: 0.75;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .social-link:hover {
            color: var(--gold);
            opacity: 1;
            transform: scale(1.1);
        }

        /* Small screen responsive adjustments */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            .login-container {
                padding: 35px 20px;
            }
            .brand-logo-img {
                width: 90px;
                height: 90px;
            }
        }

        .password-toggle-btn:hover {
            opacity: 1 !important;
            color: var(--gold) !important;
        }

        /* Forgot Password Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: #111;
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            color: var(--white);
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--gray-light);
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
        }
        .modal-close:hover {
            color: var(--gold);
        }
        .modal-title {
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }
        .modal-subtitle {
            font-size: 0.85rem;
            color: var(--gray-light);
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .modal-step {
            display: none;
        }
        .modal-step.active {
            display: block;
        }
        .modal-msg {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .modal-msg.error {
            color: #ff4d4d;
            display: block;
        }
        .modal-msg.success {
            color: #4CAF50;
            display: block;
        }
    </style>
</head>

    <!-- Javascript focus interaction and login fetch execution logic -->
    <script>
        // Add visual focus class to input wrappers
        const inputs = document.querySelectorAll('.input-field');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.input-wrapper').classList.add('focused');
            });
            input.addEventListener('blur', () => {
                input.closest('.input-wrapper').classList.remove('focused');
            });
        });

        // Form Submit Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailVal = document.getElementById('email').value;
            const passwordVal = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember').checked;

            const data = {
                email: emailVal,
                password: passwordVal,
                remember: rememberMe
            };
            
            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    alert('Login successful', () => {
                        if (result.user && result.user.role === 'admin') {
                            window.location.href = 'admintest/dashboardtest.php';
                        } else {
                            window.location.href = 'menutest.html';
                        }
                    });
                } else if (result.inactive) {
                    alert(result.message || 'Please verify your account first.', () => {
                        window.location.href = 'verify_otp.php';
                    });
                } else {
                    alert(result.message || 'Login failed. Please check your credentials.');
                }
            } catch (err) {
                console.error('Error during login fetch:', err);
                alert('Network error or server unavailable. Please try again later.');
            }
        });
        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eyeOpen');
        const eyeClosed = document.getElementById('eyeClosed');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeOpen.style.display = isPassword ? 'none' : 'block';
            eyeClosed.style.display = isPassword ? 'block' : 'none';
        });

        // Prevent focus loss when clicking eye icon
        togglePassword.addEventListener('mousedown', (e) => {
            e.preventDefault();
        });

        // Toggle modal password fields
        function toggleModalPwd(btn) {
            const input = btn.previousElementSibling;
            const isPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isPassword ? 'text' : 'password');
            btn.querySelector('.eye-open').style.display = isPassword ? 'none' : 'block';
            btn.querySelector('.eye-closed').style.display = isPassword ? 'block' : 'none';
        }

        // --- Forgot Password Modal Logic ---
        const modal = document.getElementById('forgotModal');
        const msgBox = document.getElementById('modalMsg');

        function openForgotModal(e) {
            e.preventDefault();
            modal.classList.add('active');
            showStep('step-request');
            msgBox.className = 'modal-msg';
            msgBox.innerHTML = '';
            document.getElementById('forgotEmail').value = document.getElementById('email').value; // pre-fill
        }

        function closeForgotModal() {
            modal.classList.remove('active');
            // reset inputs
            document.getElementById('forgotEmail').value = '';
            document.getElementById('forgotOtp').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        function showStep(stepId) {
            document.querySelectorAll('.modal-step').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
            msgBox.className = 'modal-msg';
            msgBox.innerHTML = '';
        }

        function showModalMsg(text, type) {
            msgBox.innerHTML = text;
            msgBox.className = 'modal-msg ' + type;
        }

        async function sendOtp() {
            const email = document.getElementById('forgotEmail').value;
            const btn = document.getElementById('btnSendOtp');
            if(!email) return showModalMsg('Email is required', 'error');

            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                const res = await fetch('api/forgot-password.php?action=send_otp', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if(data.success) {
                    showModalMsg(data.message, 'success');
                    setTimeout(() => showStep('step-verify'), 1500);
                } else {
                    showModalMsg(data.message, 'error');
                }
            } catch (err) {
                showModalMsg('Network error', 'error');
            }
            btn.textContent = 'Send OTP';
            btn.disabled = false;
        }

        async function verifyOtp() {
            const email = document.getElementById('forgotEmail').value;
            const otp = document.getElementById('forgotOtp').value;
            const btn = document.getElementById('btnVerifyOtp');
            if(!otp) return showModalMsg('OTP is required', 'error');

            btn.textContent = 'Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch('api/forgot-password.php?action=verify_otp', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const data = await res.json();
                if(data.success) {
                    showModalMsg(data.message, 'success');
                    setTimeout(() => showStep('step-reset'), 1000);
                } else {
                    showModalMsg(data.message, 'error');
                }
            } catch (err) {
                showModalMsg('Network error', 'error');
            }
            btn.textContent = 'Verify Code';
            btn.disabled = false;
        }

        async function resetPassword() {
            const password = document.getElementById('newPassword').value;
            const confirm_password = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('btnResetPwd');
            if(!password || !confirm_password) return showModalMsg('Please fill both fields', 'error');

            btn.textContent = 'Resetting...';
            btn.disabled = true;

            try {
                const res = await fetch('api/forgot-password.php?action=reset_password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, confirm_password })
                });
                const data = await res.json();
                if(data.success) {
                    showModalMsg(data.message, 'success');
                    setTimeout(() => {
                        closeForgotModal();
                        document.getElementById('password').value = password; // pre-fill login
                    }, 2000);
                } else {
                    showModalMsg(data.message, 'error');
                }
            } catch (err) {
                showModalMsg('Network error', 'error');
            }
            btn.textContent = 'Reset Password';
            btn.disabled = false;
        }
    </script>
</body>

</html>
